# dacapo configuration: the defaults the plugin ships with.
#
# Agents never read this file. The orchestrator asks the mcp__dacapo__config tool for the values in force,
# and /dacapo-config shows them to you, with the file each one came from.
#
# To change a value, copy this file and edit the copy; a later file overrides an earlier one, key by key:
#   1. this file, inside the installed plugin (replaced on every update; do not edit it there)
#   2. $DACAPO_HOME/dacapo.conf when DACAPO_HOME is set, else ~/.claude/dacapo.conf, for every repository you work in
#   3. .dacapo.conf at the root of one repository (dacapo keeps it out of git)
# A line starting with # is a comment. Lists are separated by commas.

# The loop a run walks when the prompt carries no --loop flag. The plugin ships three:
# core-fast: no judges. core: QA as the end user. core-deep: QA, then an engineering review of the run's change.
# A loop of your own in ~/.claude/dacapo/loops/<name>/ ($DACAPO_HOME/loops/<name>/ when that is set) or
# <repository>/.claude/dacapo/loops/<name>/ is named the same way.
loop = core

# The branch a run is cut from and merges back into through its final pull request, when the orchestrator is not told another.
base-branch = main

# How many evidence collectors a judge may run at once when its loop node sets no collectors of its own (the shipped
# QA node sets 3). A judge may split the rubric among collector subagents that use the product on their slice and
# bring the evidence back; the judge alone scores. 0 keeps the judge on its own.
qa-collectors = 3

# The models a loop's nodes may name, strongest first. Each node lists its own models in the loop; a node naming a model
# outside these three lists is refused when the run starts.
workers = opus, sonnet
qa = opus, sonnet
review = opus, sonnet

# The skills that say how work lands: how a worker commits, and how a pull request is written.
# Point them at skills of your own (a project or user skill, or one from another plugin) to use your conventions;
# with a skill other than the shipped one, dacapo trusts it and skips its own commit-title and attribution checks.
commits-skill = dacapo:rules-commits
prs-skill = dacapo:rules-prs

# Fable, the most capable model, costs more. Uncomment to allow it:
# workers = fable, opus, sonnet
# qa = fable, opus, sonnet
# review = fable, opus, sonnet
